name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Locate project.yml
        id: loc
        run: |
          DIR=$(dirname "$(find . -name project.yml -not -path './.git/*' | head -1)")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project dir: $DIR"

      - name: Generate Xcode project
        working-directory: ${{ steps.loc.outputs.dir }}
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ${{ steps.loc.outputs.dir }}
        run: xcodebuild -resolvePackageDependencies -project InvoiceScanner.xcodeproj -scheme InvoiceScanner

      - name: Build (unsigned)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          xcodebuild build \
            -project InvoiceScanner.xcodeproj \
            -scheme InvoiceScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/InvoiceScanner.app Payload/
          zip -qry InvoiceScanner.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceScanner-ipa
          path: ${{ steps.loc.outputs.dir }}/InvoiceScanner.ipa
