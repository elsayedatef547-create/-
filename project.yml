name: InvoiceScanner
options:
  bundleIdPrefix: com.invoicescanner
  createIntermediateGroups: true
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
packages:
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX.git
    exactVersion: 0.14.0
targets:
  InvoiceScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: CoreXLSX
        product: CoreXLSX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invoicescanner.app
        PRODUCT_NAME: InvoiceScanner
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_LANGUAGE: ar
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
schemes:
  InvoiceScanner:
    build:
      targets:
        InvoiceScanner: all
    run:
      config: Debug
    archive:
      config: Release
